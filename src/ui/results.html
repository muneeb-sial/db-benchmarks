<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DB Bench Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Same terminal theme as index.html, written as plain CSS (no Tailwind on this page). */
      :root {
        --bg: #000; --panel: #0d0d0d; --hover: #0f0f0f;
        --text: #e6e6e6; --text-2: #cfcfcf; --dim: #8a8a8a; --dimmer: #666;
        --line: #2e2e2e; --line-strong: #4a4a4a;
        --accent: #d77757; --accent-soft: #eba185;
        --ok: #4eba65; --ok-soft: #7ad48c; --na: #ffb347; --fail: #ff6b80;
        --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
      }
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #3d3d3d #000; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #3d3d3d; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
      ::selection { background: var(--accent); color: #000; }
      html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
      body { font: 13px/1.5 var(--mono); font-feature-settings: 'calt' 0; -webkit-font-smoothing: antialiased; }
      a { color: var(--accent-soft); text-decoration: none; }
      a:hover { color: var(--accent); }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      code, pre { font-family: var(--mono); }

      header { border-bottom: 1px solid var(--accent); flex: none; }
      header .bar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header h1::before { content: '✻ '; color: var(--accent); }
      header p { margin: 0; font-size: 11px; color: var(--dim); }
      nav { display: flex; gap: 4px; font-size: 12px; }
      nav a { padding: 3px 10px; border: 1px solid var(--line-strong); color: var(--dim); }
      nav a:hover { border-color: var(--accent); color: var(--accent); }
      nav a.on { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

      /*
       * Wide screens: an app-style layout. The page itself never scrolls; the
       * header stays put, and the sidebar and the run detail each scroll on
       * their own, so a long or wide run never stretches the page or drags
       * the sidebar. Wide tables scroll sideways inside their card (.scroll).
       */
      main { padding: 16px; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; }
      .col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
      @media (min-width: 1024px) {
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        main { flex: 1; min-height: 0; align-items: stretch; }
        .col { min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
        /* the sidebar's run list fills the column and scrolls inside its card */
        .col.side { overflow: hidden; padding-right: 0; }
        .col.side > .card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .col.side #runs { flex: 1; min-height: 0; max-height: none; }
      }
      /* Narrow screens: one column, normal page scroll. */
      @media (max-width: 1023px) { main { grid-template-columns: minmax(0, 1fr); } }

      .card { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; }
      .card.flush { padding: 0; }
      .card.flush > .head { padding: 10px 16px; border-bottom: 1px solid var(--line); margin: 0; }
      .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); }
      h2::before { content: '› '; color: var(--accent); }
      h2.fold { cursor: pointer; user-select: none; }
      h2.fold:hover { color: var(--accent); }
      h2.fold::before { content: '▾ '; }
      .collapsed h2.fold::before { content: '▸ '; }
      .collapsed > :not(.head) { display: none; }
      .collapsed > .head { margin-bottom: 0; border-bottom: 0 !important; }
      h3 { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--accent-soft); }
      h3:first-child { margin-top: 0; }

      .muted { color: var(--dim); }
      .dimmer { color: var(--dimmer); }
      .ok { color: var(--ok); } .na { color: var(--na); } .fail { color: var(--fail); } .acc { color: var(--accent); }
      .small { font-size: 11px; }
      .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
      .tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line-strong); font-size: 11px; color: var(--dim); }
      .tag.warn { border-color: var(--na); color: var(--na); }
      .tag.good { border-color: var(--ok); color: var(--ok); }

      input.filter { width: 100%; background: #000; color: var(--text); border: 1px solid var(--line-strong); padding: 5px 8px; font: 12px var(--mono); caret-color: var(--accent); }
      input.filter:focus { outline: none; border-color: var(--accent); }
      input.filter::placeholder { color: var(--dimmer); }
      .btn { border: 1px solid var(--line-strong); padding: 2px 8px; font-size: 11px; color: var(--dim); }
      .btn:hover { border-color: var(--accent); color: var(--accent); }

      /* run list: one entry per results/<run-id>, like an ls listing */
      #runs { list-style: none; margin: 10px 0 0; padding: 0; max-height: calc(100vh - 190px); overflow-y: auto; }
      @media (max-width: 1023px) { #runs { max-height: 360px; } }
      #runs li { border-left: 2px solid transparent; padding: 7px 10px; cursor: pointer; border-top: 1px solid var(--line); }
      #runs li:first-child { border-top: 0; }
      #runs li:hover { background: var(--hover); }
      #runs li.sel { border-left-color: var(--accent); background: #140c09; }
      #runs li.sel .when::before { content: '> '; color: var(--accent); }
      #runs .when { font-weight: 600; }
      #runs .line { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; }

      /* key/value grid */
      dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; margin: 0; }
      dl.kv dt { color: var(--dim); }
      dl.kv dd { margin: 0; overflow-wrap: anywhere; }
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
      @media (max-width: 639px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .stat { border: 1px solid var(--line); padding: 8px 10px; }
      .stat .k { font-size: 11px; color: var(--dim); }
      .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      thead th { background: var(--panel); color: var(--dim); font-weight: 500; text-align: left; padding: 6px 10px; white-space: nowrap; position: sticky; top: 0; }
      thead th.num { text-align: right; }
      td { padding: 5px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
      tbody tr:hover { background: var(--hover); }
      tr.click { cursor: pointer; }
      tr.group td { background: #070707; color: var(--accent-soft); font-weight: 600; padding-top: 8px; }
      tr.group td::before { content: '## '; color: var(--dimmer); }
      td.best { color: var(--ok); font-weight: 600; }
      td.best::after { content: ' ★'; font-size: 10px; }
      td.worst { color: var(--fail); }
      .legend { font-size: 11px; color: var(--dim); padding: 8px 16px; border-top: 1px solid var(--line); }

      /* text bars, ████░░ style */
      .bars { display: grid; grid-template-columns: max-content minmax(60px, 1fr) max-content; gap: 2px 10px; font-size: 12px; align-items: center; }
      .bars .bar { color: var(--accent); white-space: nowrap; overflow: hidden; letter-spacing: -1px; }
      .bars .bar .rest { color: #222; }
      .bars .total { color: var(--text); font-weight: 600; }

      /* file tree */
      .tree { font-size: 12px; white-space: pre; overflow-x: auto; margin: 0; }
      .tree .f { cursor: pointer; color: var(--text); }
      .tree .f:hover, .tree .f.sel { color: var(--accent); text-decoration: underline; }
      .tree .d { color: var(--accent-soft); font-weight: 600; }
      .tree .g { color: var(--dimmer); }

      pre.out { margin: 0; background: #000; padding: 12px; max-height: 560px; overflow: auto; font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); }
      .j-key { color: var(--accent-soft); } .j-str { color: var(--ok-soft); } .j-num { color: #ffc66d; } .j-lit { color: #c792ea; }

      ul.reasons { list-style: none; margin: 0; padding: 0; font-size: 12px; }
      ul.reasons li { padding: 3px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; }
      ul.reasons li:first-child { border-top: 0; }

      .empty { color: var(--dim); padding: 24px 0; text-align: center; }
      .empty::after { content: '█'; color: var(--accent); animation: blink 1.1s steps(1) infinite; margin-left: 4px; }
      @keyframes blink { 50% { opacity: 0; } }
      .hidden { display: none !important; }

      @media (max-width: 639px) {
        header p { display: none; }
        main { padding: 12px; gap: 12px; }
        .card { padding: 12px; }
        td, thead th { padding-left: 8px; padding-right: 8px; }
        input.filter { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div>
          <h1>DB Bench Results</h1>
          <p>Every suite run saved under results/: what was asked, what ran, and how it did.</p>
        </div>
        <nav><a href="/">runner</a><a href="/results" class="on">results</a></nav>
      </div>
    </header>

    <main>
      <section class="col side">
        <div class="card">
          <div class="head">
            <h2>runs <span id="run-count" class="muted"></span></h2>
            <button id="refresh" class="btn" title="Re-read results/">refresh</button>
          </div>
          <input id="run-filter" class="filter" placeholder="filter, e.g. postgres r2 or 10-31" />
          <ul id="runs"><li class="empty">reading results/</li></ul>
        </div>
      </section>

      <section class="col" id="detail">
        <div class="card"><p class="empty">pick a run</p></div>
      </section>
    </main>

    <script type="module" src="./results.ts"></script>
  </body>
</html>
